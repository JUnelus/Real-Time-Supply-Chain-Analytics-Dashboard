name: Daily Dashboard CI

on:
  push:
  schedule:
    # Runs every day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only audit packages that ship in the built dashboard. Dev-only tooling
      # (eslint, vite, playwright) is excluded so advisories against lint/build
      # helpers do not fail the scheduled run; Dependabot still bumps them.
      - name: Security audit (prod deps, moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

