version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"
    groups:
      # playwright and @playwright/test must be bumped together or the
      # runner and the browser driver fall out of sync.
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"

